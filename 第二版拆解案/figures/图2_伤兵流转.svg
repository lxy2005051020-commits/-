<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-label="伤兵容量流转"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#62748b" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fc"/><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" fill="#172a43"><text x="40" y="48" font-size="27" font-weight="700">图2  伤兵容量：损兵、可恢复量与治疗消耗</text><text x="40" y="83" font-size="17" fill="#56677e">以兵刃受击与单次跨回合规则为例｜来源S05、S06｜研究变量不等于战报公开隐藏字段</text><rect x="45" y="140" width="290" height="110" rx="12" fill="#edf2fc" stroke="#b5c4d8"/><text x="190" y="176" text-anchor="middle" font-size="19"><tspan x="190" dy="0">实际损兵 ΔT</tspan><tspan x="190" dy="26">当前兵力T减少</tspan><tspan x="190" dy="26">缺兵量M增加</tspan></text><rect x="435" y="140" width="290" height="110" rx="12" fill="#e8f5ef" stroke="#b5c4d8"/><text x="580" y="176" text-anchor="middle" font-size="19"><tspan x="580" dy="0">可恢复伤兵池 W</tspan><tspan x="580" dy="26">逐笔新增 floor(0.90×ΔT)</tspan><tspan x="580" dy="26">始终受缺兵量M限制</tspan></text><rect x="825" y="140" width="290" height="110" rx="12" fill="#edf2fc" stroke="#b5c4d8"/><text x="970" y="176" text-anchor="middle" font-size="19"><tspan x="970" dy="0">治疗与恢复</tspan><tspan x="970" dy="26">H实际=min(H名义,W,M)</tspan><tspan x="970" dy="26">T增加，W同量减少</tspan></text><path d="M335 195L435 195" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M725 195L825 195" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="435" y="340" width="290" height="105" rx="12" fill="#fff3e3" stroke="#b5c4d8"/><text x="580" y="373.5" text-anchor="middle" font-size="19"><tspan x="580" dy="0">跨一个回合边界</tspan><tspan x="580" dy="26">剩余W保留90%并向下取整</tspan><tspan x="580" dy="26">回合内跨行动不作该衰减</tspan></text><path d="M580 250L580 340" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="340" width="290" height="105" rx="12" fill="#fff3e3" stroke="#b5c4d8"/><text x="190" y="373.5" text-anchor="middle" font-size="19"><tspan x="190" dy="0">当前不可战斗内恢复缺口</tspan><tspan x="190" dy="26">N − T − W</tspan><tspan x="190" dy="26">不命名为战后永久死兵</tspan></text><path d="M435 392L335 392" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="825" y="340" width="290" height="105" rx="12" fill="#fcecee" stroke="#b5c4d8"/><text x="970" y="373.5" text-anchor="middle" font-size="19"><tspan x="970" dy="0">动态阻断</tspan><tspan x="970" dy="26">禁疗有效或目标阵亡等</tspan><tspan x="970" dy="26">实际恢复可能为0</tspan></text><path d="M970 340L970 250" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="520" font-size="18" fill="#56677e"><tspan x="45">急救：合格受击结算后判定。休整：目标自身行动开始窗口结算。</tspan><tspan x="45" dy="32">同一名义治疗量，可能因伤兵容量、禁疗与发生时点不同，兑现为不同实际恢复量。</tspan><tspan x="45" dy="32">90%生成比率并非所有伤害家族均已逐类实证；连续多回合递推亦需与单回合证据分层。</tspan></text></g></svg>