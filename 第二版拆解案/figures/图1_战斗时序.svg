<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1020" viewBox="0 0 1160 1020" role="img" aria-label="战斗时序与普通攻击分支"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#62748b" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fc"/><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" fill="#172a43"><text x="40" y="46" font-size="27" font-weight="700">图1  战斗时序：行动顺位与动作许可分别判断</text><text x="40" y="80" font-size="16" fill="#56677e">行为模型｜Research支持的关系与模拟器规则分开记录｜参见正文1.2及来源S03、S04、S07、S08、S11—S13</text><rect x="110" y="105" width="400" height="76" rx="12" fill="#ffffff" stroke="#b5c4d8"/><text x="310" y="137" text-anchor="middle" font-size="19"><tspan x="310" dy="0">准备阶段：建立属性、战法与状态</tspan><tspan x="310" dy="26">不采用四类全局顺序概括游戏</tspan></text><path d="M310 181L310 220" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="110" y="220" width="400" height="76" rx="12" fill="#ffffff" stroke="#b5c4d8"/><text x="310" y="252" text-anchor="middle" font-size="19"><tspan x="310" dy="0">回合开始：边界效果与本轮排序</tspan><tspan x="310" dy="26">纯先攻层 → 普通层 → 纯遇袭层</tspan></text><path d="M310 296L310 335" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="110" y="335" width="400" height="90" rx="12" fill="#ffffff" stroke="#b5c4d8"/><text x="310" y="361" text-anchor="middle" font-size="19"><tspan x="310" dy="0">目标自身行动开始窗口</tspan><tspan x="310" dy="26">生命周期、休整与持续伤害等</tspan><tspan x="310" dy="26">同窗口不预设治疗／跳伤统一先后</tspan></text><path d="M310 425L310 465" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="110" y="465" width="400" height="76" rx="12" fill="#ffffff" stroke="#b5c4d8"/><text x="310" y="497" text-anchor="middle" font-size="19"><tspan x="310" dy="0">检查当前动作许可</tspan><tspan x="310" dy="26">震慑／计穷／缴械分别限制</tspan></text><path d="M310 541L310 580" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="110" y="580" width="400" height="76" rx="12" fill="#ffffff" stroke="#b5c4d8"/><text x="310" y="612" text-anchor="middle" font-size="19"><tspan x="310" dy="0">符合条件的主动／准备与普攻</tspan><tspan x="310" dy="26">按来源规则分别进入结算</tspan></text><path d="M310 656L310 695" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="110" y="695" width="400" height="76" rx="12" fill="#ffffff" stroke="#b5c4d8"/><text x="310" y="727" text-anchor="middle" font-size="19"><tspan x="310" dy="0">行动完成，推进后续合法武将</tspan><tspan x="310" dy="26">每次伤害内部处理合格反应</tspan></text><path d="M310 771L310 810" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="110" y="810" width="400" height="76" rx="12" fill="#ffffff" stroke="#b5c4d8"/><text x="310" y="842" text-anchor="middle" font-size="19"><tspan x="310" dy="0">回合结束或符合终战条件</tspan><tspan x="310" dy="26">当前允许结算完成后再结束</tspan></text><text x="650" y="132" font-size="22" font-weight="700">放大：一次标准普攻的简化链</text><rect x="635" y="165" width="455" height="65" rx="12" fill="#edf2fc" stroke="#b5c4d8"/><text x="862.5" y="204.5" text-anchor="middle" font-size="19"><tspan x="862.5" dy="0">普攻许可 → 选敌 → 援护等目标处理</tspan></text><path d="M862 230L862 265" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="635" y="265" width="455" height="65" rx="12" fill="#edf2fc" stroke="#b5c4d8"/><text x="862.5" y="304.5" text-anchor="middle" font-size="19"><tspan x="862.5" dy="0">实际目标：防御判定与伤害结算</tspan></text><path d="M862 330L862 365" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="635" y="365" width="455" height="80" rx="12" fill="#e8f5ef" stroke="#b5c4d8"/><text x="862.5" y="399" text-anchor="middle" font-size="19"><tspan x="862.5" dy="0">合格受击反应（如急救）</tspan><tspan x="862.5" dy="26">及当前允许的派生效果</tspan></text><path d="M862 445L862 480" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="635" y="480" width="455" height="65" rx="12" fill="#edf2fc" stroke="#b5c4d8"/><text x="862.5" y="519.5" text-anchor="middle" font-size="19"><tspan x="862.5" dy="0">标准反击批次（若符合条件）</tspan></text><path d="M862 545L862 580" fill="none" stroke="#62748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="635" y="580" width="455" height="80" rx="12" fill="#edf2fc" stroke="#b5c4d8"/><text x="862.5" y="614" text-anchor="middle" font-size="19"><tspan x="862.5" dy="0">检查攻击者存活与终战条件</tspan><tspan x="862.5" dy="26">再进入突击／连击下一击机会</tspan></text><path d="M510 618L620 618" stroke="#62748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="635" y="705" width="455" height="110" rx="12" fill="#fff3e3" stroke="#b5c4d8"/><text x="862.5" y="741" text-anchor="middle" font-size="19"><tspan x="862.5" dy="0">死亡边界：不统一清空一切后续事件</tspan><tspan x="862.5" dy="26">已产生的合法结算按各自规则完成</tspan><tspan x="862.5" dy="26">未来动作仍需通过存活与终战检查</tspan></text><text x="40" y="946" font-size="17" fill="#56677e"><tspan x="40">图示省略技能特例与复杂分担拓扑；急救受击后判定，不能阻止这笔伤害已经造成的致死。</tspan><tspan x="40" dy="28">四阶段调度仅是Battle用户批准的V1实现规则；本图不将其呈现为真实游戏的固定加载栈。</tspan></text></g></svg>